<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Peg Solitaire | Professional Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #071626 0%, #0a1f2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Roboto', 'Poppins', system-ui, sans-serif;
            padding: 20px;
        }

        /* Ana kart */
        .game-card {
            max-width: 750px;
            width: 100%;
            background: #fef9e6;
            background: linear-gradient(135deg, #fffaf0 0%, #fdf4e0 100%);
            border-radius: 48px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 200, 0.6);
            overflow: hidden;
            transition: all 0.2s;
        }

        /* Başlık alanı */
        .game-header {
            background: #0a2a3b;
            background: linear-gradient(95deg, #0a2a3b, #123d52);
            padding: 18px 24px;
            text-align: center;
            border-bottom: 3px solid #e6b422;
        }

        .game-header h1 {
            color: #ffdf8c;
            font-size: 2rem;
            letter-spacing: 2px;
            text-shadow: 0 2px 5px #00000030;
            font-weight: 600;
            word-break: keep-all;
        }

        .game-header p {
            color: #b9d9e8;
            font-size: 0.85rem;
            margin-top: 6px;
        }

        /* Seçim alanı (dropdown) */
        .select-area {
            padding: 16px 24px 8px 24px;
            background: #f3ecd8;
            border-bottom: 1px solid #e2d4b9;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .select-label {
            font-weight: bold;
            color: #1e4a6e;
            background: #e9dfc3;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        select {
            flex: 2;
            min-width: 180px;
            background: #1f2e3b;
            color: #ffeaac;
            border: 1px solid #e6b422;
            border-radius: 60px;
            padding: 10px 18px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            font-family: monospace;
            outline: none;
            transition: 0.1s;
        }

        select:focus {
            border-color: #ffcd7e;
            box-shadow: 0 0 0 2px #e6b42255;
        }

        /* canvas alanı */
        .canvas-container {
            padding: 16px 24px 8px 24px;
            background: #eedecc;
        }

        canvas {
            display: block;
            margin: 0 auto;
            background: #dbbc8c;
            border-radius: 36px;
            box-shadow: inset 0 0 0 4px #a47148, 0 12px 24px rgba(0, 0, 0, 0.3);
            width: 100%;
            height: auto;
            cursor: pointer;
        }

        /* istatistik paneli */
        .stats-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f2f3a;
            margin: 12px 24px 20px 24px;
            padding: 10px 20px;
            border-radius: 80px;
            color: #f7ecc7;
            box-shadow: inset 0 1px 3px #ffffff30, 0 4px 8px #00000030;
        }

        .stat {
            background: #00000055;
            backdrop-filter: blur(2px);
            padding: 5px 18px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.3rem;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .stat span:first-child {
            font-size: 0.9rem;
            font-weight: normal;
            letter-spacing: 1px;
        }

        button#resetBtn {
            background: #e6b422;
            border: none;
            font-weight: bold;
            font-size: 1rem;
            padding: 8px 20px;
            border-radius: 40px;
            color: #0a2a3b;
            cursor: pointer;
            transition: 0.07s linear;
            box-shadow: 0 3px 0 #8b5a2b;
            transform: translateY(-2px);
            font-family: inherit;
        }

        button#resetBtn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        .message-area {
            text-align: center;
            margin: 0 24px 24px 24px;
            background: #ebdfbd;
            padding: 8px;
            border-radius: 60px;
            font-weight: bold;
            color: #1e4a6e;
            font-size: 0.85rem;
            border: 1px solid #cfbc8a;
        }

        @media (max-width: 550px) {
            .stat { font-size: 1rem; padding: 3px 12px; }
            .select-area { flex-direction: column; align-items: stretch; }
            button#resetBtn { padding: 6px 16px; }
            .game-header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
<div class="game-card">
    <div class="game-header">
        <h1>⚜️ PEG SOLITAIRE ⚜️</h1>
        <p>navy & gold | klasik bulmaca</p>
    </div>

    <div class="select-area">
        <div class="select-label">🎯 Tahta Seçimi</div>
        <select id="boardSelect"></select>
        <div style="font-size:0.75rem; color:#4a5b4e;">▼ seç ve başla</div>
    </div>

    <div class="canvas-container">
        <canvas id="pegCanvas" width="500" height="500"></canvas>
    </div>

    <div class="stats-panel">
        <div class="stat"><span>📌 HAMLE</span> <span id="moveCount">0</span></div>
        <div class="stat"><span>⏱️ SÜRE</span> <span id="timerDisplay">00:00</span></div>
        <button id="resetBtn">⟳ SIFIRLA</button>
    </div>

    <div class="message-area" id="gameMsg">Bir tahta seçin ve oyuna başlayın</div>
</div>

<script>
    // --------------------------------------------------------------
    // TÜM TAHTA TANIMLARI (16 farklı varyasyon)
    // --------------------------------------------------------------
    const BOARD_DEFS = {
        "English": { rows:7, cols:7, startEmpty:[3,3], shape:(r,c)=> ( (r<=1||r>=5)&&c>=2&&c<=4 ) || (r>=2&&r<=4&&c>=0&&c<=6) },
        "French": { rows:7, cols:7, startEmpty:[3,3], shape:(r,c)=> (r===0||r===6)&&c>=2&&c<=4 ? true : (r===1||r===5)&&c>=1&&c<=5 ? true : r>=2&&r<=4&&c>=0&&c<=6 },
        "European 37": { rows:7, cols:7, startEmpty:[3,3], shape:(r,c)=> Math.abs(r-3)+Math.abs(c-3) <= 3 },
        "Hexagonal 61": { rows:9, cols:9, startEmpty:[4,4], shape:(r,c)=> Math.abs(r-4)+Math.abs(c-4) <= 4 && Math.abs(r-c) <= 4 },
        "Square 16": { rows:4, cols:4, startEmpty:[1,1], shape:()=>true },
        "Square 25": { rows:5, cols:5, startEmpty:[2,2], shape:()=>true },
        "Square 36 #1": { rows:6, cols:6, startEmpty:[2,2], shape:()=>true },
        "Square 36 #2": { rows:6, cols:6, startEmpty:[2,3], shape:()=>true },
        "Square 36 #3": { rows:6, cols:6, startEmpty:[3,3], shape:()=>true },
        "Triangle 8x8": { rows:8, cols:15, startEmpty:[0,0], shape:(r,c)=> c <= r },
        "Trapezoid": { rows:5, cols:7, startEmpty:[2,3], shape:(r,c)=> r===0? c>=2&&c<=4 : r===1? c>=1&&c<=5 : r>=2 && c>=0&&c<=6 },
        "Rhombus": { rows:7, cols:7, startEmpty:[3,3], shape:(r,c)=> Math.abs(r-3)+Math.abs(c-3) <= 3 },
        "Snowflake": { rows:7, cols:7, startEmpty:[3,3], shape:(r,c)=> (r===0||r===6)&&c===3 ? true : (r===1||r===5)&&c>=1&&c<=5 ? true : r>=2&&r<=4&&c>=0&&c<=6 },
        "Wiegleb": { rows:7, cols:7, startEmpty:[3,3], shape:(r,c)=> (r===0||r===6)&&c>=2&&c<=4 ? true : (r===1||r===5)&&c>=1&&c<=5 ? true : r>=2&&r<=4&&c>=0&&c<=6 },
        "Asymmetric": { rows:7, cols:7, startEmpty:[2,2], shape:(r,c)=> (r<=4&&c<=4&&!(r===0&&c===0)) || (r===5&&c>=1&&c<=3) || (r===6&&c===2) }
    };

    // oyun durumu
    let currentId = "English";
    let rows, cols, board, isValid, selectedRow = null, selectedCol = null;
    let moveCount = 0, timerSeconds = 0, timerInterval = null;
    const canvas = document.getElementById('pegCanvas');
    let ctx = canvas.getContext('2d');
    let cellW, cellH;

    // yardımcı fonksiyonlar
    function stopTimer() { if(timerInterval) clearInterval(timerInterval); timerInterval = null; }
    function startTimer() { stopTimer(); timerInterval = setInterval(()=>{ timerSeconds++; updateTimerDisplay(); },1000); }
    function updateTimerDisplay() { let m=Math.floor(timerSeconds/60), s=timerSeconds%60; document.getElementById('timerDisplay').innerText=`${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }
    
    function countPegs() { let cnt=0; for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) if(isValid[r][c] && board[r][c]===true) cnt++; return cnt; }
    
    function updateUI() {
        document.getElementById('moveCount').innerText = moveCount;
        let left = countPegs();
        let msgDiv = document.getElementById('gameMsg');
        if(left === 1) msgDiv.innerHTML = "🏆 MUHTEŞEM! Tek çivi kaldı! 🎉";
        else if(left === 0) msgDiv.innerHTML = "✨ İnanılmaz! Sıfır çivi ile kazandınız ✨";
        else msgDiv.innerHTML = `🔹 Kalan çivi: ${left}  |  Hamle: ${moveCount}  |  Devam et!`;
    }

    // tahta yükleme
    function loadBoard(boardId) {
        stopTimer();
        const def = BOARD_DEFS[boardId];
        if(!def) return;
        rows = def.rows; cols = def.cols;
        isValid = Array(rows).fill().map(()=>Array(cols).fill(false));
        for(let i=0;i<rows;i++) for(let j=0;j<cols;j++) isValid[i][j] = def.shape(i,j);
        board = Array(rows).fill().map(()=>Array(cols).fill(null));
        for(let i=0;i<rows;i++) for(let j=0;j<cols;j++) if(isValid[i][j]) board[i][j] = true;
        let [er,ec] = def.startEmpty;
        if(isValid[er]?.[ec]) board[er][ec] = false;
        else {
            for(let i=0;i<rows;i++) { let done=false; for(let j=0;j<cols;j++) if(isValid[i][j]){ board[i][j]=false; done=true; break; } if(done) break; }
        }
        moveCount = 0; timerSeconds = 0;
        updateTimerDisplay();
        document.getElementById('moveCount').innerText = "0";
        selectedRow = null;
        startTimer();
        updateUI();
        drawBoard();
        currentId = boardId;
        // dropdown seçimini senkronize et
        const selectEl = document.getElementById('boardSelect');
        if(selectEl) selectEl.value = boardId;
    }

    // hamle geçerlilik
    function isValidMove(fr,fc,tr,tc) {
        if(!isValid[tr]?.[tc] || board[tr][tc] !== false) return false;
        if(!isValid[fr]?.[fc] || board[fr][fc] !== true) return false;
        let dr = tr-fr, dc = tc-fc;
        if((Math.abs(dr)===2 && dc===0)) { let mr=(fr+tr)/2, mc=fc; if(isValid[mr][mc] && board[mr][mc]===true) return true; }
        if((Math.abs(dc)===2 && dr===0)) { let mr=fr, mc=(fc+tc)/2; if(isValid[mr][mc] && board[mr][mc]===true) return true; }
        return false;
    }
    function applyMove(fr,fc,tr,tc) {
        if(!isValidMove(fr,fc,tr,tc)) return false;
        let mr=(fr+tr)/2, mc=(fc+tc)/2;
        board[fr][fc] = false; board[mr][mc] = false; board[tr][tc] = true;
        moveCount++;
        updateUI();
        drawBoard();
        return true;
    }

    // ----- ŞIK ÇİZİM (navy/gold teması) -----
    function drawBoard() {
        if(!ctx) return;
        // canvas boyutunu ayarla (gerçek pixel)
        const rect = canvas.getBoundingClientRect();
        const sz = Math.min(rect.width, rect.height);
        canvas.width = sz; canvas.height = sz;
        cellW = canvas.width / cols;
        cellH = canvas.height / rows;
        ctx.clearRect(0,0,canvas.width,canvas.height);
        // zemin altın tonu
        ctx.fillStyle = '#d6a15a';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        
        for(let r=0; r<rows; r++) {
            for(let c=0; c<cols; c++) {
                let x = c*cellW, y = r*cellH;
                let rad = Math.min(cellW,cellH)*0.28;
                if(isValid[r][c]) {
                    // delik tabanı (koyu gölge)
                    ctx.beginPath();
                    ctx.arc(x+cellW/2, y+cellH/2, rad+1.5, 0, Math.PI*2);
                    ctx.fillStyle = '#7c5a38';
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x+cellW/2, y+cellH/2, rad, 0, Math.PI*2);
                    ctx.fillStyle = '#f7e5c2';
                    ctx.fill();
                    
                    if(board[r][c] === true) {
                        // altın çivi
                        ctx.beginPath();
                        ctx.arc(x+cellW/2, y+cellH/2, rad-2, 0, Math.PI*2);
                        ctx.fillStyle = '#e6b422';
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(x+cellW/2, y+cellH/2, rad-4, 0, Math.PI*2);
                        ctx.fillStyle = '#c5851a';
                        ctx.fill();
                        // minik ışıltı
                        ctx.fillStyle = '#fff2b5';
                        ctx.beginPath();
                        ctx.arc(x+cellW/2-3, y+cellH/2-3, rad*0.12, 0, Math.PI*2);
                        ctx.fill();
                    } 
                    else if(board[r][c] === false) {
                        // boş delik – koyu lacivert iç
                        ctx.beginPath();
                        ctx.arc(x+cellW/2, y+cellH/2, rad-3, 0, Math.PI*2);
                        ctx.fillStyle = '#1e3a5f';
                        ctx.fill();
                        ctx.fillStyle = '#ffdd99';
                        ctx.font = `${Math.floor(rad)}px "Segoe UI Emoji"`;
                        ctx.fillText("✦", x+cellW/2-6, y+cellH/2+5);
                    }
                    
                    // seçili çivi vurgusu
                    if(selectedRow === r && selectedCol === c && board[r][c] === true) {
                        ctx.beginPath();
                        ctx.arc(x+cellW/2, y+cellH/2, rad+4, 0, Math.PI*2);
                        ctx.strokeStyle = '#ffd966';
                        ctx.lineWidth = 3;
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(x+cellW/2, y+cellH/2, rad+1, 0, Math.PI*2);
                        ctx.strokeStyle = '#e6b422';
                        ctx.stroke();
                    }
                } else {
                    // geçersiz alan: desenli
                    ctx.fillStyle = '#b47c48';
                    ctx.fillRect(x+2, y+2, cellW-4, cellH-4);
                    ctx.fillStyle = '#8b5a2b';
                    ctx.font = `${Math.floor(cellW*0.3)}px "Segoe UI"`;
                    ctx.fillText("⚜️", x+cellW*0.35, y+cellH*0.7);
                }
            }
        }
    }

    // tıklama yönetimi
    function handleCanvasTap(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let clientX, clientY;
        if(e.touches) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
            e.preventDefault();
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }
        let canvasX = (clientX - rect.left) * scaleX;
        let canvasY = (clientY - rect.top) * scaleY;
        if(canvasX<0 || canvasY<0 || canvasX>canvas.width || canvasY>canvas.height) return;
        let col = Math.floor(canvasX / cellW);
        let row = Math.floor(canvasY / cellH);
        if(row<0 || row>=rows || col<0 || col>=cols || !isValid[row][col]) {
            selectedRow = null;
            drawBoard();
            return;
        }
        if(selectedRow === null) {
            if(board[row][col] === true) {
                selectedRow = row;
                selectedCol = col;
                drawBoard();
                document.getElementById('gameMsg').innerHTML = "➡️ Şimdi atlanacak çivinin üzerinden boşluğa tıkla";
            } else {
                document.getElementById('gameMsg').innerHTML = "🔔 Önce bir çivi seçmelisin!";
                setTimeout(()=>updateUI(), 800);
            }
        } else {
            if(isValidMove(selectedRow, selectedCol, row, col)) {
                applyMove(selectedRow, selectedCol, row, col);
                selectedRow = null;
                drawBoard();
                // oyun bitti mi kontrolü (isteğe bağlı)
            } else {
                if(board[row][col] === true) {
                    selectedRow = row;
                    selectedCol = col;
                    drawBoard();
                    document.getElementById('gameMsg').innerHTML = "🔄 Yeni çivi seçildi, atlamaya hazır";
                } else {
                    selectedRow = null;
                    drawBoard();
                    document.getElementById('gameMsg').innerHTML = "❌ Geçersiz atlama! Tekrar dene.";
                    setTimeout(()=>updateUI(), 1000);
                }
            }
        }
        updateUI();
    }

    // dropdown menüyü doldur
    function populateSelect() {
        const selectEl = document.getElementById('boardSelect');
        selectEl.innerHTML = "";
        for(let name of Object.keys(BOARD_DEFS)) {
            let opt = document.createElement('option');
            opt.value = name;
            opt.innerText = name;
            selectEl.appendChild(opt);
        }
        selectEl.addEventListener('change', (e) => {
            loadBoard(e.target.value);
        });
    }

    // sayfa başlatma
    function init() {
        populateSelect();
        loadBoard("English");
        canvas.addEventListener('click', handleCanvasTap);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleCanvasTap(e); });
        document.getElementById('resetBtn').addEventListener('click', () => loadBoard(currentId));
        window.addEventListener('resize', () => drawBoard());
    }
    
    init();
</script>
</body>
</html>
